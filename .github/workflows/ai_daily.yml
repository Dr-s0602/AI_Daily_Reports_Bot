name: AI Daily Report

# 동일한 워크플로가 동시에 실행되면서
# 같은 날짜의 보고서를 중복 생성하거나 push 충돌을 일으키는 것을 막습니다.
concurrency:
  group: ai-daily-report-main
  cancel-in-progress: false

on:
  schedule:
    # GitHub Actions의 cron은 UTC 기준입니다.
    # UTC 22:00은 한국 시간으로 다음 날 오전 07:00입니다.
    - cron: "0 22 * * *"

  # GitHub Actions 화면에서 수동 실행할 수 있도록 허용합니다.
  workflow_dispatch:

jobs:
  run-daily-report:
    runs-on: ubuntu-latest

    # Gemini API 재시도와 보고서 생성이 길어질 경우를 고려한 제한입니다.
    timeout-minutes: 45

    # 생성된 reports 파일을 저장소에 push하기 위해 필요합니다.
    permissions:
      contents: write

    steps:
      # ------------------------------------------------------
      # 1. 저장소 체크아웃
      # ------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # 뒤에서 git rebase를 실행하므로 전체 커밋 이력을 가져옵니다.
          fetch-depth: 0

      # ------------------------------------------------------
      # 2. Python 환경 준비
      # ------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

          # requirements.txt가 변경되지 않았다면
          # 이전에 설치한 pip 패키지를 캐시에서 재사용합니다.
          cache: pip
          cache-dependency-path: requirements.txt

      # ------------------------------------------------------
      # 3. 의존성 설치
      # ------------------------------------------------------
      - name: Install dependencies
        run: |
          set -e

          python -m pip install --upgrade pip
          python -m pip install --upgrade -r requirements.txt

      # ------------------------------------------------------
      # 4. 주요 라이브러리 설치 및 import 검사
      # ------------------------------------------------------
      - name: Verify Python dependencies
        run: |
          set -e

          echo "=== Installed package versions ==="
          python -m pip show google-genai
          python -m pip show arxiv
          python -m pip show ddgs

          echo "=== Import verification ==="
          python - <<'PY'
          from google import genai
          from google.genai import types
          from ddgs import DDGS
          import arxiv

          print("google-genai import OK")
          print("ddgs import OK")
          print("arxiv import OK")
          PY

      # ------------------------------------------------------
      # 5. 일일 AI 보고서 생성
      # ------------------------------------------------------
      - name: Run AI Daily Report
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

          # 코드에서 기본값을 사용하고 있으므로 필수는 아닙니다.
          # 모델을 명시적으로 고정하려면 아래 값을 유지합니다.
          GEMINI_MODEL: gemini-2.5-flash
        run: |
          set -e
          python scripts/daily_ai_report.py

      # ------------------------------------------------------
      # 6. 생성된 보고서를 Google Drive에 복사
      # ------------------------------------------------------
      - name: Mirror to Google Drive
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_OAUTH_TOKEN_JSON: ${{ secrets.GDRIVE_OAUTH_TOKEN_JSON }}
        run: |
          set -e
          python scripts/upload_to_drive.py

      # ------------------------------------------------------
      # 7. 생성된 reports 파일 커밋 및 push
      # ------------------------------------------------------
      - name: Commit and push reports
        env:
          BRANCH: main
        run: |
          set -e

          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          # 보고서 폴더의 변경 사항만 스테이징합니다.
          git add reports

          # 변경 사항이 없다면 정상 종료합니다.
          if git diff --cached --quiet; then
            echo "No changes in reports/. Commit and push skipped."
            exit 0
          fi

          # 로컬에 보고서 커밋을 먼저 만듭니다.
          #
          # 기존 워크플로는 보고서 파일이 생성된 상태에서
          # 먼저 rebase를 시도했기 때문에 작업 트리 상태에 따라
          # rebase가 거부될 가능성이 있었습니다.
          git commit -m "chore: add AI daily report"

          # 다른 커밋이 main에 먼저 push됐을 가능성에 대비해
          # 최대 세 번 fetch → rebase → push를 시도합니다.
          for i in 1 2 3; do
            echo "Push attempt ${i}/3"

            git fetch origin "${BRANCH}"

            if ! git rebase "origin/${BRANCH}"; then
              echo "Rebase failed."
              git rebase --abort || true
              exit 1
            fi

            if git push origin "HEAD:${BRANCH}"; then
              echo "Push succeeded."
              exit 0
            fi

            echo "Push failed. Retrying after 3 seconds..."
            sleep 3
          done

          echo "Push failed after 3 attempts."
          exit 1
